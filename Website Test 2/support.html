<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support &mdash; Stand On That!</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <div class="navbar wrap">
    <a class="brand" href="index.html">Stand <em>On That!</em></a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="content.html">Behind the Build</a>
      <a href="subscribe.html">Membership</a>
      <a href="support.html" class="active">Support</a>
    </nav>
  </div>
</header>

<section class="hero" style="padding:64px 0 40px;">
  <div class="wrap">
    <p class="kicker">One-time support</p>
    <h1 style="font-size:clamp(2rem,4.6vw,3rem);">Buy me a coffee, or a spool of thread.</h1>
    <p>No account needed, no recurring charge. Pick an amount or enter your own.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));">
      <div class="card"><h3>$5</h3><button class="btn btn-primary" data-tip="500">Give $5</button></div>
      <div class="card"><h3>$10</h3><button class="btn btn-primary" data-tip="1000">Give $10</button></div>
      <div class="card"><h3>$25</h3><button class="btn btn-primary" data-tip="2500">Give $25</button></div>
      <div class="card">
        <h3>Custom</h3>
        <input id="custom-amt" type="number" min="1" step="1" placeholder="$ amount" style="width:100%;padding:10px;background:var(--bg-alt);border:1px solid var(--line);color:var(--paper);margin-bottom:10px;">
        <button class="btn btn-outline" id="custom-tip-btn">Give</button>
      </div>
    </div>
    <p class="status-msg" id="status"></p>
  </div>
</section>

<footer class="site">
  <div class="wrap">
    <p>&copy; 2026 Stand On That! Payments handled securely by Stripe.</p>
  </div>
</footer>

<script src="js/checkout.js"></script>
<script>
document.querySelectorAll('[data-tip]').forEach(btn => {
  btn.addEventListener('click', () => startCheckout({ mode: 'payment', id: 'donation', amountCents: parseInt(btn.dataset.tip, 10) }, btn));
});
document.getElementById('custom-tip-btn').addEventListener('click', (e) => {
  const dollars = parseFloat(document.getElementById('custom-amt').value);
  if (!dollars || dollars <= 0) { document.getElementById('status').textContent = 'Enter an amount first.'; return; }
  startCheckout({ mode: 'payment', id: 'donation', amountCents: Math.round(dollars * 100) }, e.target);
});
</script>
</body>
</html>
